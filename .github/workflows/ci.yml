name: CI Pipeline

on:
  push:
    branches: [ main, "feat/*", "feature/*", "fix/*", "chore/*", "refactor/*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: featureflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Check Formatting (gofmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted with gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Run Go Vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          args: --timeout=5m

      - name: Build Application
        run: go build -v ./...

      - name: Run Tests
        run: go test -v ./...

      - name: Start API for k6 Tests
        env:
          PORT: 3000
          DB_HOST: localhost
          DB_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: featureflow_test
          DB_SSLMODE: disable
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test_secret_ci_environment
          JWT_REFRESH_SECRET: test_secret_ci_environment
          DISABLE_RATE_LIMIT: "true"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
        run: |
          go build -o api .
          ./api &
          sleep 5

      - name: Run k6 Smoke Test
        uses: grafana/k6-action@v0.3.1
        env:
          TEST_MODE: smoke
          API_URL: http://localhost:3000/api/v1
        with:
          filename: tests/load/auth_test.js
